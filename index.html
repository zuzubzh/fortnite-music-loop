<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="Une image plein écran avec la musique Fortnite OG en boucle.">
  <title>Fortnite OG — boucle</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #080808; }
    body { width: 100vw; height: 100vh; height: 100dvh; }
    .scene { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; }
    .scene-image { display: block; width: 100%; height: 100%; object-fit: fill; }
    #youtube-player {
      position: fixed; left: -220px; top: 0; width: 200px; height: 200px;
      overflow: hidden; opacity: .001; pointer-events: none;
    }
  </style>
</head>
<body>
  <main class="scene">
    <img class="scene-image" src="assets/image.jpg" alt="">
  </main>
  <div id="youtube-player" aria-hidden="true"></div>
  <script>
    const videoId = "Ow2eSjJR6TA";
    const activationEvents = ["pointerdown", "touchstart", "keydown", "click"];
    let player;
    let playerReady = false;

    function activateSound() {
      if (!playerReady || !player) return;
      player.unMute();
      player.setVolume(100);
      if (player.getPlayerState() !== YT.PlayerState.PLAYING) player.playVideo();
      for (const eventName of activationEvents) {
        window.removeEventListener(eventName, activateSound, true);
      }
    }

    for (const eventName of activationEvents) {
      window.addEventListener(eventName, activateSound, true);
    }

    function onYouTubeIframeAPIReady() {
      player = new YT.Player("youtube-player", {
        width: "200",
        height: "200",
        videoId,
        playerVars: {
          autoplay: 1,
          controls: 0,
          disablekb: 1,
          fs: 0,
          loop: 1,
          playlist: videoId,
          playsinline: 1,
          rel: 0
        },
        events: {
          onReady(event) {
            player = event.target;
            playerReady = true;
            player.setVolume(100);
            player.playVideo();
          }
        }
      });
    }

    const api = document.createElement("script");
    api.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(api);
  </script>
</body>
</html>
