<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="Une image plein écran avec la musique Fortnite OG en boucle.">
  <title>Fortnite OG — boucle</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #080808; }
    body { width: 100vw; height: 100vh; height: 100dvh; }
    .scene { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; }
    .scene-image { display: block; width: 100%; height: 100%; object-fit: fill; }
    .background-audio { display: none; }
  </style>
</head>
<body>
  <main class="scene">
    <img class="scene-image" src="assets/image.jpg" alt="">
  </main>
  <audio id="background-audio" class="background-audio" src="music.mp3" autoplay loop preload="auto" aria-hidden="true"></audio>
  <script>
    const audio = document.getElementById("background-audio");
    const activationEvents = ["pointerdown", "touchstart", "keydown", "click"];

    function startMusic() {
      const playback = audio.play();
      if (playback && typeof playback.then === "function") {
        playback.then(() => {
          for (const eventName of activationEvents) {
            window.removeEventListener(eventName, startMusic, true);
          }
        }).catch(() => {});
      }
    }

    startMusic();
    for (const eventName of activationEvents) {
      window.addEventListener(eventName, startMusic, true);
    }
  </script>
</body>
</html>
